<body class="spark-widget-shell">
<script>
const { state } = WH.createApp({
    title: "Min-Heap Visualizer",
    params: {
        val: { type: 'number', value: 5, min: 0, max: 99, label: "Value" },
        insert: { type: 'button', label: 'Insert', onClick: () => startInsert() },
        poll: { type: 'button', label: 'Poll Min', onClick: () => startPoll() },
        reset: { type: 'button', label: 'Reset', onClick: () => resetHeap() }
    },
    internal_state: {
        heap: [4, 12, 8, 23, 19, 15],
        activeIndices: [],
        comparingIndices: [],
        status: "Idle",
        stepTrigger: 0
    },
    sizing: { viz: { height: 420 } },
    editorial: {
        hud: [
            { label: "Heap Size", value: "6" },
            { label: "Status", value: "Idle" }
        ]
    }
});

const INITIAL_HEAP = [4, 12, 8, 23, 19, 15];

let animTimer = null;
let animQueue = [];
let isAnimating = false;

function resetHeap() {
    clearTimeout(animTimer);
    animQueue = [];
    isAnimating = false;
    state.heap = [...INITIAL_HEAP];
    state.activeIndices = [];
    state.comparingIndices = [];
    state.status = "Idle";
    state.stepTrigger = (state.stepTrigger || 0) + 1;
    updateEditorial();
}

function startInsert() {
    if (isAnimating) return;
    if (state.heap.length >= 15) {
        state.status = "Heap Full (Max 15)";
        updateEditorial();
        return;
    }
    const val = Number(state.val);
    if (isNaN(val)) return;

    isAnimating = true;
    animQueue = [];

    let currentHeap = [...state.heap];
    currentHeap.push(val);
    let idx = currentHeap.length - 1;

    animQueue.push({
        heap: [...currentHeap],
        comparing: [idx],
        active: [idx],
        status: `Inserted ${val} at index ${idx}`
    });

    while (idx > 0) {
        let parentIdx = Math.floor((idx - 1) / 2);
        animQueue.push({
            heap: [...currentHeap],
            comparing: [idx, parentIdx],
            active: [idx],
            status: `Comparing ${currentHeap[idx]} with parent ${currentHeap[parentIdx]}`
        });

        if (currentHeap[idx] < currentHeap[parentIdx]) {
            let temp = currentHeap[idx];
            currentHeap[idx] = currentHeap[parentIdx];
            currentHeap[parentIdx] = temp;
            idx = parentIdx;

            animQueue.push({
                heap: [...currentHeap],
                comparing: [idx],
                active: [idx],
                status: `Swapped! Sifting up to index ${idx}`
            });
        } else {
            break;
        }
    }

    animQueue.push({
        heap: [...currentHeap],
        comparing: [],
        active: [],
        status: "Insert Complete"
    });

    runQueue();
}

function startPoll() {
    if (isAnimating) return;
    if (state.heap.length === 0) {
        state.status = "Heap Empty";
        updateEditorial();
        return;
    }

    isAnimating = true;
    animQueue = [];

    let currentHeap = [...state.heap];
    const minVal = currentHeap[0];

    if (currentHeap.length === 1) {
        currentHeap.pop();
        animQueue.push({
            heap: [],
            comparing: [],
            active: [],
            status: `Polled ${minVal}. Heap is now empty.`
        });
    } else {
        const lastVal = currentHeap.pop();
        currentHeap[0] = lastVal;

        animQueue.push({
            heap: [...currentHeap],
            comparing: [0],
            active: [0],
            status: `Removed min ${minVal}, moved last element ${lastVal} to root`
        });

        let idx = 0;
        const length = currentHeap.length;

        while (true) {
            let leftChild = 2 * idx + 1;
            let rightChild = 2 * idx + 2;
            let smallest = idx;
            let toCompare = [idx];

            if (leftChild < length) toCompare.push(leftChild);
            if (rightChild < length) toCompare.push(rightChild);

            if (leftChild < length && currentHeap[leftChild] < currentHeap[smallest]) {
                smallest = leftChild;
            }
            if (rightChild < length && currentHeap[rightChild] < currentHeap[smallest]) {
                smallest = rightChild;
            }

            if (toCompare.length > 1) {
                animQueue.push({
                    heap: [...currentHeap],
                    comparing: toCompare,
                    active: [idx],
                    status: `Comparing parent ${currentHeap[idx]} with children`
                });
            }

            if (smallest !== idx) {
                let temp = currentHeap[idx];
                currentHeap[idx] = currentHeap[smallest];
                currentHeap[smallest] = temp;
                idx = smallest;

                animQueue.push({
                    heap: [...currentHeap],
                    comparing: [idx],
                    active: [idx],
                    status: `Swapped with child! Sifting down to index ${idx}`
                });
            } else {
                break;
            }
        }

        animQueue.push({
            heap: [...currentHeap],
            comparing: [],
            active: [],
            status: `Poll Complete. Returned ${minVal}`
        });
    }

    runQueue();
}

function runQueue() {
    if (animQueue.length === 0) {
        isAnimating = false;
        state.status = "Idle";
        state.activeIndices = [];
        state.comparingIndices = [];
        state.stepTrigger = (state.stepTrigger || 0) + 1;
        updateEditorial();
        return;
    }

    const step = animQueue.shift();
    state.heap = step.heap;
    state.comparingIndices = step.comparing;
    state.activeIndices = step.active;
    state.status = step.status;
    state.stepTrigger = (state.stepTrigger || 0) + 1;
    updateEditorial();

    animTimer = setTimeout(() => {
        runQueue();
    }, 850);
}

function updateEditorial() {
    ui.setEditorial({
        hud: [
            { label: "Heap Size", value: String(state.heap.length) },
            { label: "Status", value: state.status || "Idle" }
        ]
    });
}

const { vizTop, vizBottom } = WH.splitViz('65%');

WH.initCanvas(vizTop, ({ ctx }) => {
    return ({ width, height, minDim }) => {
        const heap = state.heap || [];
        const comparing = state.comparingIndices || [];
        const active = state.activeIndices || [];

        if (heap.length === 0) {
            ctx.fillStyle = '#93a3be';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = '16px sans-serif';
            ctx.fillText("Heap is empty", width / 2, height / 2);
            return;
        }

        const nodePositions = [];
        const maxLevels = 4;
        const levelHeight = (height - 50) / maxLevels;

        for (let i = 0; i < 15; i++) {
            const level = Math.floor(Math.log2(i + 1));
            const levelNodes = Math.pow(2, level);
            const indexInLevel = i - (levelNodes - 1);
            const sectionWidth = width / levelNodes;
            const x = sectionWidth * indexInLevel + sectionWidth / 2;
            const y = 30 + level * levelHeight;
            nodePositions.push({ x, y });
        }

        const radius = Math.min(20, Math.max(14, minDim * 0.055));

        // Draw edges
        for (let i = 0; i < heap.length; i++) {
            const leftChild = 2 * i + 1;
            const rightChild = 2 * i + 2;
            const parentPos = nodePositions[i];

            if (leftChild < heap.length) {
                const childPos = nodePositions[leftChild];
                ctx.beginPath();
                ctx.moveTo(parentPos.x, parentPos.y);
                ctx.lineTo(childPos.x, childPos.y);
                ctx.strokeStyle = 'rgba(140,170,220,0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }

            if (rightChild < heap.length) {
                const childPos = nodePositions[rightChild];
                ctx.beginPath();
                ctx.moveTo(parentPos.x, parentPos.y);
                ctx.lineTo(childPos.x, childPos.y);
                ctx.strokeStyle = 'rgba(140,170,220,0.25)';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // Draw nodes
        for (let i = 0; i < heap.length; i++) {
            const pos = nodePositions[i];
            const isComparing = comparing.includes(i);
            const isActive = active.includes(i);

            let fillColor = '#162136';
            let strokeColor = '#3b82f6';
            let textColor = '#e7edf7';

            if (isComparing) {
                fillColor = '#d97706';
                strokeColor = '#f59e0b';
                textColor = '#ffffff';
            } else if (isActive) {
                fillColor = '#1d4ed8';
                strokeColor = '#60a5fa';
                textColor = '#ffffff';
            }

            ctx.beginPath();
            ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
            ctx.fillStyle = fillColor;
            ctx.fill();
            ctx.strokeStyle = strokeColor;
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.fillStyle = textColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.font = 'bold 13px sans-serif';
            ctx.fillText(String(heap[i]), pos.x, pos.y);

            ctx.fillStyle = '#93a3be';
            ctx.font = '10px monospace';
            ctx.fillText(`[${i}]`, pos.x, pos.y + radius + 11);
        }
    };
}, { height: 260 });

WH.initTable(vizBottom, () => {
    const currentHeap = state.heap || [];
    const comparing = state.comparingIndices || [];

    const data = currentHeap.map((val, idx) => ({
        index: `[${idx}]`,
        val: val,
        role: idx === 0 ? 'Root (Min)' : `Parent [${Math.floor((idx - 1) / 2)}]`
    }));

    return {
        data: data,
        columns: [
            { key: 'index', label: 'Index' },
            { key: 'val', label: 'Value' },
            { key: 'role', label: 'Tree Node Role' }
        ],
        highlightCondition: (row) => {
            const num = parseInt(row.index.replace(/[^0-9]/g, ''), 10);
            return comparing.includes(num);
        }
    };
});

state._subscribe('stepTrigger', () => {
    updateEditorial();
});
updateEditorial();
</script>
</body>
</html>
